# Put this file at: .github/workflows/profile-3d.yml
# It draws the 3D contribution graph used in README.md and refreshes it every day.

name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "30 18 * * *" # every day at 12:00 AM IST
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "Update 3D contribution graph" || echo "No changes"
          git push
